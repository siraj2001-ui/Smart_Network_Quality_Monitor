<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Network Quality Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Smart Network Quality Monitor</h1>
    <p class="subtitle">Latest measurement per customer</p>
  </header>

  <main>
    <section class="kpis" id="kpis">
      <div class="card"><span class="label">Total customers</span><span class="value" id="kpi-total">-</span></div>
      <div class="card normal"><span class="label">Normal</span><span class="value" id="kpi-normal">-</span></div>
      <div class="card monitor"><span class="label">Monitor</span><span class="value" id="kpi-monitor">-</span></div>
      <div class="card severe"><span class="label">Severe</span><span class="value" id="kpi-severe">-</span></div>
      <div class="card invalid"><span class="label">Invalid</span><span class="value" id="kpi-invalid">-</span></div>
    </section>

    <section class="filters">
      <input type="search" id="search" placeholder="Search customer ID (e.g. CUST-001)">
      <select id="city"><option value="">All cities</option></select>
      <select id="severity"><option value="">All severities</option></select>
      <select id="profile"><option value="">All profiles</option></select>
      <select id="sort">
        <option value="">Default order</option>
        <option value="score_desc">Priority: high to low</option>
        <option value="score_asc">Priority: low to high</option>
      </select>
      <button id="reset" type="button">Reset</button>
    </section>

    <p id="status" class="status" aria-live="polite"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Customer ID</th><th>City</th><th>Profile</th>
            <th>Latency (ms)</th><th>Throughput (Mbps)</th>
            <th>Packet loss (%)</th><th>Congestion (%)</th>
            <th>Severity</th><th>Priority score</th><th>Reasons</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/dashboard.js"></script>
</body>
</html>
